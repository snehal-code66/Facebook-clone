        /* Layout */
        .container {
            max-width: 1200px;

            display: grid;
            grid-template-columns: 250px 1fr 250px;

            height: fit-content;

            margin-bottom: 15px;
        }

        .sidebar p {
            padding: 12px 0;
            cursor: pointer;
        }

        .sidebar p:hover {
            color: #1877f2;
        }

        /* Create post */
        .create-post {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .create-post textarea {
            width: 100%;
            height: 80px;
            resize: none;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        .post-btn {
            margin-top: 10px;
            background: #1877f2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        .post-btn:hover {
            background: #166fe5;
        }

        /* Posts */
        .post {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
